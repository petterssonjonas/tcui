name: release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  linux:
    name: Validate and release
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_ID: ${{ github.event.release.id }}
      RELEASE_SHA: ${{ github.sha }}
      MISE_EXEC_AUTO_INSTALL: "false"
    steps:
      - name: Require a published stable release
        env:
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          test "$GITHUB_EVENT_NAME" = release
          test "$RELEASE_DRAFT" = false
          test "$RELEASE_PRERELEASE" = false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact release commit
        id: release
        shell: bash
        run: |
          sha="$(bash scripts/release-ref.sh "$RELEASE_TAG" "$RELEASE_SHA")"
          # Release events load their workflow from the tag, not current main.
          # Refuse a stale release definition before building or uploading.
          git show "$sha:.github/workflows/release.yml" | cmp - .github/workflows/release.yml
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.17
          install: false
          cache: false
      - name: Install package inspection tools
        run: sudo apt-get update && sudo apt-get install -y binutils rpm cpio
      - run: bash scripts/setup-ci.sh full
      - name: Run full CI and package smoke
        run: mise exec -- bash scripts/ci.sh full
      - name: Smoke release payload on glibc 2.34
        run: bash scripts/smoke-oldest-runtime.sh
      - name: Scan release history for secrets
        run: bash scripts/scan-secrets.sh
      - name: Upload validated assets to the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          bash scripts/release-ref.sh "$RELEASE_TAG" "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_SHA"
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import json, os, sys
          with open(sys.argv[1]) as source:
              release = json.load(source)
          assert str(release["id"]) == os.environ["RELEASE_ID"]
          assert release["tag_name"] == os.environ["RELEASE_TAG"]
          assert not release["draft"] and not release["prerelease"] and release["published_at"]
          PY
          for asset in "${CARGO_TARGET_DIR:-target}"/dist/*; do
            name="$(basename "$asset")"
            [[ "$name" =~ ^[A-Za-z0-9._-]+$ ]]
            # The release ID fixes the upload destination; duplicate names fail.
            gh api --method POST \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" \
              -H 'Content-Type: application/octet-stream' --input "$asset"
          done