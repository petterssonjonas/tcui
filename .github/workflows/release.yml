name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable vX.Y.Z tag on main to build and publish"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  linux:
    name: Validate and release
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      MISE_EXEC_AUTO_INSTALL: "false"
    steps:
      - name: Require dispatch on main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact release commit
        id: release
        run: |
          sha="$(bash scripts/release-ref.sh "$RELEASE_TAG")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.17
          install: false
          cache: false
      - name: Install package inspection tools
        run: sudo apt-get update && sudo apt-get install -y binutils rpm cpio
      - run: bash scripts/setup-ci.sh full
      - name: Run full CI and package smoke
        run: mise exec -- bash scripts/ci.sh full
      - name: Smoke release payload on glibc 2.34
        run: bash scripts/smoke-oldest-runtime.sh
      - name: Scan release history for secrets
        run: bash scripts/scan-secrets.sh
      - name: Publish validated assets without overwriting a release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(bash scripts/release-ref.sh "$RELEASE_TAG")" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_SHA"
          gh release create "$RELEASE_TAG" "${CARGO_TARGET_DIR:-target}"/dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$RELEASE_SHA" \
            --title "TCUI $RELEASE_TAG" --generate-notes