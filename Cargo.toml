[package]
name = "tcui"
version = "0.8.0"
edition = "2021"
description = "ChatGPT-style terminal chat UI"
license = "GPL-3.0-only"
repository = "https://github.com/petterssonjonas/tcui"

[features]
default = ["memory"]
memory = [
  "dep:model2vec-rs",
  "dep:sqlite-vec",
  "dep:tokenizers",
  "rmcp/server",
  "rmcp/transport-io",
  "rmcp/macros",
]

[dependencies]
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "io-std", "net", "signal"] }
futures = "0.3.34"
pulldown-cmark = "0.13.5"
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-fish = "3.6.0"
merman-core = { version = "=0.9.2", default-features = false, features = ["diagram-flowchart", "diagram-xychart", "diagram-pie"] }
merman-ascii = { version = "=0.9.2", default-features = false, features = ["diagram-flowchart"] }
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
tui-term = "0.3.4"
portable-pty = "0.9"
bytes = "1.12.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "stream", "rustls"] }
rmcp = { version = "1.8", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
lol_html = "3.0.1"
htmlize = { version = "1.1", features = ["unescape"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "serialize"] }
similar = "3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2.0.1"
toml = "1.1.8"
color-eyre = "0.6"
walkdir = "2"
notify = "8.2"
base64 = "0.23.1"
dirs = "7"
chrono = { version = "0.4.45", features = ["serde"] }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
zeroize = "1.9.1"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
libc = "0.2.191"
rand = "0.10.3"
blake3 = "1.8.7"
webbrowser = { version = "1.2.5", features = ["hardened"] }
rustix = { version = "1.1.5", features = ["fs", "process"] }
unicode-width = "0.2"
unicode-segmentation = "1.13"
unicode-normalization = "0.1.26"
clap = { version = "4.6.7", features = ["derive"] }
thiserror = "2"
oauth2 = { version = "5.0.0", default-features = false, features = ["timing-resistant-secret-traits"] }
secrecy = "0.10"
model2vec-rs = { version = "0.3", optional = true, default-features = false, features = ["local-only"] }
# Select the Rust regex backend directly: Model2Vec's backend features also
# enable C++ tokenizer training and a progress bar, neither needed for inference.
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["fancy-regex"] }
sqlite-vec = { version = "=0.1.9", optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }

[profile.dev]
opt-level = 3

[package.metadata.deb]
maintainer = "TermChatUI maintainers"
copyright = "2026 TermChatUI maintainers"
section = "utils"
priority = "optional"
# Enforced against the ELF payload, independently of the packaging host's libc.
depends = "libc6 (>= 2.34), libgcc-s1, ca-certificates"
assets = [
  ["target/release/tcui", "usr/bin/tcui", "755"],
  ["README.md", "usr/share/doc/tcui/README.md", "644"],
  ["LICENSE", "usr/share/doc/tcui/LICENSE", "644"],
  ["assets/models/potion-base-8M/LICENSE", "usr/share/doc/tcui/potion-base-8M-LICENSE", "644"],
]

[package.metadata.generate-rpm]
# No package scriptlets need a shell interpreter.
require-sh = false
assets = [
  { source = "target/release/tcui", dest = "/usr/bin/tcui", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/tcui/README.md", mode = "644" },
  { source = "LICENSE", dest = "/usr/share/doc/tcui/LICENSE", mode = "644" },
  { source = "assets/models/potion-base-8M/LICENSE", dest = "/usr/share/doc/tcui/potion-base-8M-LICENSE", mode = "644" },
]

[package.metadata.generate-rpm.requires]
"glibc(x86-64)" = ">= 2.34"
"libgcc_s.so.1(GCC_4.2.0)(64bit)" = "*"
ca-certificates = "*"
